<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стиль бароко — Код мистецтва</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lora:ital@0;1&display=swap">
<style>
:root{--bg:#2a0a16;--card:#4a1a2c;--gold:#d4af6a;--ink:#f4eadb;--soft:#e3cfc6;--meme:#e9e4df;--memeink:#333;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf5ee;--card:#f0e2d6;--gold:#8a5a12;--ink:#3b0f1e;--soft:#6b4a55}}
:root[data-theme="light"]{--bg:#faf5ee;--card:#f0e2d6;--gold:#8a5a12;--ink:#3b0f1e;--soft:#6b4a55}
:root[data-theme="dark"]{--bg:#2a0a16;--card:#4a1a2c;--gold:#d4af6a;--ink:#f4eadb;--soft:#e3cfc6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;line-height:1.5}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}
#app{position:relative;height:100%;overflow:hidden}
.frame{position:absolute;inset:10px;border:1.5px solid var(--gold);border-radius:18px;pointer-events:none;z-index:3;opacity:.7}
.frame::after{content:"";position:absolute;inset:6px;border:.5px solid var(--gold);border-radius:13px}
.slide{position:absolute;inset:0;padding:38px 28px 96px;overflow-y:auto;display:flex;opacity:0;visibility:hidden;
transform:translateX(60px) scale(.98);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease,visibility 0s .6s}
.slide.active{opacity:1;visibility:visible;transform:none;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease,visibility 0s}
.slide.before{transform:translateX(-60px) scale(.98)}
.in{margin:auto;width:100%;max-width:820px}
.kick{color:var(--gold);letter-spacing:.22em;font-size:.78rem;font-weight:700;text-transform:uppercase}
h2{font-size:clamp(1.7rem,5vw,2.5rem);margin:8px 0 22px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;opacity:0;transform:translateY(18px)}
.active .item,.active .rise{animation:up .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.25s + var(--i,0)*.09s)}
@keyframes up{to{opacity:1;transform:none}}
.rise{opacity:0;transform:translateY(18px)}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--bg);font-weight:700;display:grid;place-items:center;font-family:"Playfair Display",serif}
.hero h1{font-size:clamp(2.8rem,11vw,5.5rem);line-height:1.05;margin:14px 0}
.sub{color:var(--soft);font-style:italic;font-size:1.1rem}
.sub b{color:var(--gold);font-style:normal}
.years{display:inline-block;margin:22px 0;padding:8px 18px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-weight:700}
.orn{position:absolute;right:-140px;top:50%;margin-top:-260px;width:520px;height:520px;border-radius:50%;border:1px solid var(--gold);opacity:.3;animation:spin 60s linear infinite}
.orn::before,.orn::after{content:"";position:absolute;border-radius:50%;border:1.5px solid var(--gold)}
.orn::before{inset:70px}.orn::after{inset:140px;border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
.meme{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mc{border-radius:14px;padding:22px 16px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.mc b{letter-spacing:.2em;font-size:.85rem;margin-bottom:12px}.mc i{font-size:1.15rem}
.m1{background:var(--meme);color:var(--memeink)}
.m2{background:var(--card);border:1.5px solid var(--gold)}.m2 b{color:var(--gold)}
.note{color:var(--soft);margin-top:16px}
.big{text-align:center}.big h2{font-size:clamp(2rem,8vw,3.8rem);margin:24px 0}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 22px 22px}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--gold);border:1px solid var(--gold);border-radius:99px;width:44px;height:44px;font-size:1.2rem;transition:transform .2s,background .2s}
button:hover{transform:scale(1.1);background:var(--gold);color:var(--bg)}
button:disabled{opacity:.3;pointer-events:none}
#dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:60vw}
.dot{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--gold);background:transparent}
.dot.on{background:var(--gold);transform:scale(1.35)}
#cnt{color:var(--soft);font-size:.85rem;min-width:44px;text-align:center}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#prog{position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:3px;background:rgba(212,175,106,.25);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s cubic-bezier(.2,.8,.2,1)}
@media(max-width:560px){
.frame{inset:6px;border-radius:14px}.frame::after{inset:4px;border-radius:10px}
.meme{grid-template-columns:1fr}.mc{min-height:130px;padding:16px 14px}
.slide{padding:28px 18px 104px}
.orn{opacity:.16;right:-220px;width:440px;height:440px;margin-top:-220px}
#dots{display:none}#bar{gap:22px;padding:12px 18px calc(16px)}
button{width:52px;height:52px;font-size:1.3rem}
.item{padding:12px 13px;gap:11px;font-size:.95rem;line-height:1.4;margin-bottom:8px}
.num{width:30px;height:30px;font-size:.9rem}
h2{margin:6px 0 16px}.kick{font-size:.68rem}
.sub{font-size:1rem}.years{margin:16px 0}
#cnt{font-size:.95rem;min-width:56px}}
@media(max-height:480px){.slide{padding:20px 24px 70px}#bar{padding:6px 18px 10px}button{width:38px;height:38px}h2{margin:4px 0 10px;font-size:1.5rem}.item{padding:8px 12px;margin-bottom:6px;font-size:.9rem}.hero h1{font-size:2.6rem}.mc{min-height:100px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.item,.rise{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="frame"></div><div id="stage"></div>
<div id="bar"><div id="prog"><i></i></div><button id="pv" aria-label="Назад">←</button><div id="dots"></div><span id="cnt"></span><button id="nx" aria-label="Далі">→</button></div></div>
<script>
const rows=a=>a.map((x,i)=>`<div class="item" style="--i:${i}"><span class="num">${i+1}</span><span>${x}</span></div>`).join('');
const P=[
['','', `<div class="orn"></div><div class="in hero"><div class="kick rise" style="--i:0">10-В клас</div><h1 class="rise" style="--i:1">Стиль бароко</h1><div class="sub rise" style="--i:2">Код мистецтва: художні напрями та їхні історії<br>Колективний дослідницько-творчий проєкт</div><div class="years rise" style="--i:3">1600–1750</div><div class="sub rise" style="--i:4">Виконали: <b>Лисич², Кирдан та Бурий</b></div></div>`],
['Код №1','Паспорт напряму',rows(['Назва: бароко (від італ. barocco / порт. barroco — «перлина неправильної форми»)','Роки існування: кінець XVI ст. – середина XVIII ст. (бл. 1600–1750)','Країни виникнення: Італія (Рим), далі — Іспанія, Фландрія, Франція, Німеччина','Ключові представники: Караваджо, Берніні, Борроміні, Рубенс, Рембрандт'])],
['Код №2','Історія: що відбувалося у світі',rows(['Контрреформація: католицька церква відповідає на Реформацію','Розквіт абсолютних монархій — двори змагаються в розкоші','Тридцятилітня війна (1618–1648) руйнує Європу','Наукова революція: Галілей, Кеплер, Ньютон змінюють погляд на світ','Великі географічні відкриття й торгівля збагачують міста'])],
['Код №2','Історія: що змінило мистецтво',rows(['Церква й влада замовляли мистецтво, що вражає та надихає віру','Митці «за»: силу емоцій, велич церкви й монарха, театральність','Митці «проти»: стриманості та суворої простоти Ренесансу і протестантського аскетизму','Мистецтво стало інструментом впливу на людей'])],
['Код №3','Митці: Італія та Фландрія',rows(['Мікеланджело Караваджо — різкі контрасти світла й тіні, «Покликання св. Матвія»','Джан Лоренцо Берніні — скульптор і архітектор, «Екстаз св. Терези», площа св. Петра','Пітер Пауль Рубенс — динамічні, пишні композиції з міфологічними та біблійними сюжетами'])],
['Код №3','Митці: Європа та музика',rows(['Рембрандт — світло й психологізм, «Нічна варта»','Дієго Веласкес — «Меніни», гра простору і погляду','Йоганн Себастьян Бах — вершина поліфонії','Антоніо Вівальді — «Пори року»'])],
['Код №3','Митці: українське бароко',rows(['Розквіт у XVII–XVIII ст., доба Гетьманщини','Андріївська церква в Києві — Бартоломео Растреллі','Софійський собор і Києво-Печерська лавра — барокові добудови й декор','Різьблені позолочені іконостаси','Дмитро Бортнянський — композитор, Григорій Сковорода — філософ і поет'])],
['Код №4','Цікавинка',rows(['Слово «бароко» спершу було образою: критики наступних епох називали так «безглузду й перевантажену» творчість','Лише в XIX ст. стиль почали цінувати, а сьогодні бароко — одне зі знакових надбань європейської культури','Колонада Берніні на площі св. Петра задумана як «обійми» церкви для всіх вірян'])],
['Код №5','Сучасність',rows(['Мода й дизайн: принт Versace Barocco, Dolce & Gabbana','Кіно і фото: контрастне світло й «рембрандтівське освітлення» портрета','Музика: Вівальді та Бах у кіно, рекламі, «барокових» аранжуваннях','Архітектура й інтер’єри: необароко, золотий декор, ліплення','Цифрове мистецтво: динаміка, драматичне світло, ефект «театру»'])],
['Код №6','Перлинка: мем про бароко',`<div class="meme"><div class="mc m1 rise" style="--i:0"><b>МІНІМАЛІЗМ</b><i>«Одна біла стіна, одна лампа. Досить.»</i></div><div class="mc m2 rise" style="--i:2"><b>БАРОКО</b><i>«А давайте 40 колон, позолоту, ангелів і фреску на всю стелю!»</i></div></div><p class="note rise" style="--i:4">Змістовність: мем передає головну ідею бароко — «більше, ніж потрібно»: пишність, театральність, прагнення вразити глядача.</p>`],
['Код №6 · «Мистецтво говорить»','Який головний код цього напряму?',`<div class="big"><h2 class="rise" style="--i:1">БАРОКО → ДРАМА</h2><p class="sub rise" style="--i:3">Рух, контраст, емоції, розкіш — усе працює на одне: вразити й захопити.</p></div>`],
['Підсумок','Висновки',rows(['Бароко — мистецтво руху, контрасту й сильних емоцій','Народилося в Італії та охопило всю Європу, дійшло й до України','Вплив бароко відчутний у моді, кіно, музиці та архітектурі сьогодні','Дякуємо за увагу!'])]
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),cnt=document.getElementById('cnt'),pv=document.getElementById('pv'),nx=document.getElementById('nx');
P.forEach(([k,t,h],i)=>{
  const s=document.createElement('section');s.className='slide';
  s.innerHTML=i==0?h:`<div class="in"><div class="kick rise" style="--i:0">${k}</div><h2 class="rise" style="--i:1">${t}</h2>${h}</div>`;
  stage.appendChild(s);
  const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Слайд '+(i+1));d.onclick=()=>go(i);dots.appendChild(d);
});
const sl=[...stage.children],dt=[...dots.children];let cur=-1;
function go(n){
  n=Math.max(0,Math.min(P.length-1,n));if(n===cur)return;
  sl.forEach((s,i)=>{s.classList.toggle('active',i===n);s.classList.toggle('before',i<n);if(i===n)s.scrollTop=0});
  dt.forEach((d,i)=>d.classList.toggle('on',i===n));
  document.querySelector('#prog i').style.width=((n+1)/P.length*100)+'%';cnt.textContent=(n+1)+' / '+P.length;pv.disabled=n===0;nx.disabled=n===P.length-1;cur=n;
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}
}
pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1)});
let x0=null,y0=0;addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(d)>50&&Math.abs(d)>Math.abs(dy)*1.5)go(cur+(d<0?1:-1));x0=null});
let start=0;try{start=(parseInt(location.hash.slice(1))||1)-1}catch(e){}
go(start);
</script>
</body>
</html>
